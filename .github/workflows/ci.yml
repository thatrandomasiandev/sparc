name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev + RL dependencies
        run: pip install -e ".[dev,rl]"

      - name: Ruff
        run: ruff check sparc tests

      - name: Black (check)
        run: black --check sparc tests

      - name: Mypy
        run: mypy sparc

      - name: Tests
        run: pytest tests/ -v
