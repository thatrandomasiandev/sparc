[project]
name = "sparc"
version = "0.1.0a0"
description = "Sparse-feedback Preference Active Reward Core — preference-based RL for robots with sparse, delayed, inconsistent human feedback."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joshua Terranova" }]
dependencies = [
    "numpy==1.26.4",
]

[project.scripts]
sparc = "sparc.cli.main:main"

[project.optional-dependencies]
rl = [
    "torch==2.5.1",
    "gymnasium==1.0.0",
    "stable-baselines3==2.4.0",
]
dmc = [
    "shimmy[dm-control]==2.0.0",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "black==24.10.0",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "scipy==1.14.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparc*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"tests/test_reward_model.py" = ["E402"]
"tests/test_query_optimizer.py" = ["E402"]
"tests/test_policy_bounding.py" = ["E402"]
"tests/test_drift_detector.py" = ["E402"]
"tests/test_e2e_smoke.py" = ["E402"]
"tests/test_baselines_pebble.py" = ["E402"]
"tests/test_harness_smoke.py" = ["E402"]
"tests/test_dmc_env.py" = ["E402"]
"tests/test_pebble_walker_smoke.py" = ["E402"]
"tests/test_multi_seed.py" = ["E402"]
"tests/test_sparc_harness.py" = ["E402"]
"tests/test_policy_integration.py" = ["E402"]
